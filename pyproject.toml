[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lillardhaz"
version = "0.1.0"
description = "Simultaneous-equations hazard/probit models with a Gaussian-copula correlation (Lillard 1993)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nobutaka Fukuda", email = "nobutaka.fukuda@tohoku.ac.jp" }
]
keywords = ["survival-analysis", "hazard-model", "duration-analysis", "copula", "simultaneous-equations", "probit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.urls]
Homepage = "https://github.com/nobifukuda/lillardhaz-py"
Repository = "https://github.com/nobifukuda/lillardhaz-py"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
